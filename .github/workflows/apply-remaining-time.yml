name: Apply Remaining Time

on:
  push:
    branches: [ "hide-external-media-session" ]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    name: Apply and compile
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hide-external-media-session

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply patch
        run: python3 .github/scripts/apply_remaining_time_patch.py

      - name: Compile debug APK
        run: gradle assembleDebug

      - name: Commit playback service change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/intentplayer/service/PlaybackService.kt
          git commit -m 'feat: show realtime remaining playback time'
          git push origin HEAD:hide-external-media-session
