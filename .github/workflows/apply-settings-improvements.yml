name: Apply Settings Improvements

on:
  push:
    branches: [hide-external-media-session]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hide-external-media-session
          fetch-depth: 0
      - name: Apply requested settings and playback changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          # 1) Preferences: timeout 10 min..24h, app boost 500%.
          p = Path('app/src/main/java/com/intentplayer/storage/PreferencesManager.kt')
          s = p.read_text()
          s = s.replace('const val MIN_AUTO_RESUME_TIMEOUT_MS = 1_000L', 'const val MIN_AUTO_RESUME_TIMEOUT_MS = 10L * 60L * 1000L')
          s = s.replace('const val MAX_APP_PLAYBACK_VOLUME = 2.0f', 'const val MAX_APP_PLAYBACK_VOLUME = 5.0f')
          s = s.replace('.getLong(KEY_PREF_AUTO_RESUME_TIMEOUT_MS, 30_000L)', '.getLong(KEY_PREF_AUTO_RESUME_TIMEOUT_MS, 10L * 60L * 1000L)')
          p.write_text(s)

          # 2) Settings screen: plain Japanese + coarse slider + detailed H/M/S wheel dialog.
          p = Path('app/src/main/java/com/intentplayer/ui/SettingsScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.text.KeyboardOptions\n', '')
          s = s.replace('import androidx.compose.ui.text.input.KeyboardType\n', '')
          s = s.replace('import kotlin.math.roundToLong\n', 'import androidx.compose.ui.viewinterop.AndroidView\nimport android.widget.NumberPicker\nimport kotlin.math.roundToLong\n')
          s = s.replace('title = "独自のメディア再生システムを使う",\n                description = "オンにすると、Bluetoothイヤホン・スマートウォッチ等からのメディアボタン操作を受け付けず、インテントとアプリ内操作を中心に再生します。"',
                        'title = "外部機器に再生情報を出さない",\n                description = "オンにすると、イヤホンや時計からの再生操作を受け付けず、再生中の曲情報も外部機器に表示しません。アプリ内とMacroDroidからは操作できます。"')
          s = s.replace('title = "アプリ独自の音量調整",\n                description = "オンにすると、メイン画面からシステム音量とは別に0〜200%で調整できます。100%を超える範囲はLoudnessEnhancerで増幅します。"',
                        'title = "アプリの音量をさらに大きくする",\n                description = "オンにすると、アプリ内の音量を0〜500%で調整できます。100%を超えると音を増幅するため、音源や端末によっては音が歪むことがあります。"')
          s = s.replace('title = "イヤホン脱着時の自動制御",\n                description = "イヤホンの切断時に再生を自動で停止し、再接続時に続きから再開します。"',
                        'title = "イヤホンを外したら止め、戻したら再開",\n                description = "イヤホンやBluetooth機器が外れたら自動で一時停止し、つなぎ直したら続きから再生します。"')
          s = s.replace('title = "再接続の有効期限を設定",\n                    description = "オンにすると、切断から指定時間を超えた再接続では自動再開しません。1秒〜24時間まで設定できます。"',
                        'title = "自動再開できる時間を決める",\n                    description = "オンにすると、イヤホンを外してから指定した時間を過ぎた場合は、つなぎ直しても自動再開しません。10分〜24時間で設定できます。"')
          s = s.replace('title = "消音時は自動一時停止",\n                description = "スピーカーまたはBluetooth再生中にメディア音量が0になったら一時停止し、その自動停止後に同じ出力経路で音量を上げると再開します。"',
                        'title = "音量を0にしたら自動で一時停止",\n                description = "端末やBluetooth機器の音量を0にすると自動で一時停止し、同じ出力先の音量を上げると自動で再開します。"')
          s = s.replace('title = "オーディオフォーカスを送信しない",\n                description = "オンにすると、再生開始時に他のアプリの音を止めません。オフにすると他の音楽を一時停止させながら再生を開始します。"',
                        'title = "他のアプリの音楽を止めずに再生する",\n                description = "オンにすると、IntentPlayerを再生しても他の音楽アプリへ停止を求めません。オフにすると、他のアプリの音が止まる場合があります。"')
          s = s.replace('title = "オーディオフォーカスを受信しない",\n                description = "オンにすると、他のアプリが再生を開始しても割り込みを無視して再生を続けます。"',
                        'title = "他のアプリが再生を始めても止まらない",\n                description = "オンにすると、別の音楽アプリや動画アプリが音を出し始めてもIntentPlayerはそのまま再生を続けます。"')
          s = s.replace('Text("Bluetooth再接続ディレイ時間", style = MaterialTheme.typography.titleMedium)', 'Text("イヤホン接続後、再生まで少し待つ", style = MaterialTheme.typography.titleMedium)')
          s = s.replace('"切断後、再接続された際の再生開始までの待機時間（ミリ秒）です。"', '"イヤホンやBluetooth機器をつなぎ直したあと、再生を始めるまでの待ち時間です。機器の切り替えが不安定なときに少し長くします。"')

          start = s.index('@Composable\nprivate fun AutoResumeTimeoutEditor(')
          end = s.index('\nprivate fun formatDuration', start)
          replacement = r'''@Composable
private fun AutoResumeTimeoutEditor(
    timeoutMs: Long,
    onTimeoutChanged: (Long) -> Unit
) {
    val minMs = PreferencesManager.MIN_AUTO_RESUME_TIMEOUT_MS
    val maxMs = PreferencesManager.MAX_AUTO_RESUME_TIMEOUT_MS
    val safeMs = timeoutMs.coerceIn(minMs, maxMs)
    val minMinutes = (minMs / 60_000L).toInt()
    val maxMinutes = (maxMs / 60_000L).toInt()
    val totalMinutes = (safeMs / 60_000L).toInt()
    var showDetailDialog by remember { mutableStateOf(false) }

    Column(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
        Row(
            modifier = Modifier.fillMaxWidth(),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.SpaceBetween
        ) {
            Text("自動再開できる時間", style = MaterialTheme.typography.titleMedium)
            Text(formatDuration(safeMs), style = MaterialTheme.typography.titleMedium)
        }
        Text(
            "スライダーは10分刻みで大まかに調整できます。秒単位で決めたい場合は詳細設定を使ってください。",
            style = MaterialTheme.typography.bodySmall,
            color = MaterialTheme.colorScheme.onSurfaceVariant
        )
        Slider(
            value = totalMinutes.toFloat(),
            onValueChange = { minutes ->
                val roundedMinutes = ((minutes / 10f).roundToLong() * 10L)
                    .coerceIn(minMinutes.toLong(), maxMinutes.toLong())
                onTimeoutChanged(roundedMinutes * 60_000L)
            },
            valueRange = minMinutes.toFloat()..maxMinutes.toFloat(),
            steps = ((maxMinutes - minMinutes) / 10 - 1).coerceAtLeast(0)
        )
        TextButton(onClick = { showDetailDialog = true }) {
            Text("詳しく設定する")
        }
    }

    if (showDetailDialog) {
        TimeoutDetailDialog(
            timeoutMs = safeMs,
            onDismiss = { showDetailDialog = false },
            onConfirm = { newMs ->
                onTimeoutChanged(newMs.coerceIn(minMs, maxMs))
                showDetailDialog = false
            }
        )
    }
}

@Composable
private fun TimeoutDetailDialog(
    timeoutMs: Long,
    onDismiss: () -> Unit,
    onConfirm: (Long) -> Unit
) {
    val initialSeconds = (timeoutMs / 1000L).coerceIn(600L, 86_400L)
    var hours by remember { mutableStateOf((initialSeconds / 3600L).toInt()) }
    var minutes by remember { mutableStateOf(((initialSeconds % 3600L) / 60L).toInt()) }
    var seconds by remember { mutableStateOf((initialSeconds % 60L).toInt()) }

    AlertDialog(
        onDismissRequest = onDismiss,
        title = { Text("時間を詳しく設定") },
        text = {
            Column {
                Text(
                    "時間・分・秒をそれぞれ上下に回して選びます。設定できる範囲は10分〜24時間です。",
                    style = MaterialTheme.typography.bodySmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )
                Spacer(modifier = Modifier.height(16.dp))
                Row(
                    modifier = Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    NumberWheel("時間", hours, 0, 24) { hours = it }
                    NumberWheel("分", minutes, 0, 59) { minutes = it }
                    NumberWheel("秒", seconds, 0, 59) { seconds = it }
                }
            }
        },
        confirmButton = {
            TextButton(onClick = {
                val totalSeconds = (hours * 3600L + minutes * 60L + seconds)
                    .coerceIn(600L, 86_400L)
                onConfirm(totalSeconds * 1000L)
            }) { Text("決定") }
        },
        dismissButton = { TextButton(onClick = onDismiss) { Text("キャンセル") } }
    )
}

@Composable
private fun NumberWheel(
    label: String,
    value: Int,
    minValue: Int,
    maxValue: Int,
    onValueChanged: (Int) -> Unit
) {
    Column(horizontalAlignment = Alignment.CenterHorizontally) {
        AndroidView(
            factory = { context ->
                NumberPicker(context).apply {
                    this.minValue = minValue
                    this.maxValue = maxValue
                    wrapSelectorWheel = true
                    descendantFocusability = NumberPicker.FOCUS_BLOCK_DESCENDANTS
                    setOnValueChangedListener { _, _, newValue -> onValueChanged(newValue) }
                }
            },
            update = { picker ->
                picker.minValue = minValue
                picker.maxValue = maxValue
                if (picker.value != value) picker.value = value.coerceIn(minValue, maxValue)
            },
            modifier = Modifier.width(88.dp).height(150.dp)
        )
        Text(label, style = MaterialTheme.typography.labelMedium)
    }
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 3) Main volume UI follows shared max and wording.
          p = Path('app/src/main/java/com/intentplayer/ui/MainScreen.kt')
          s = p.read_text()
          s = s.replace('text = "アプリ独自の音量"', 'text = "アプリの音量"')
          p.write_text(s)

          # 4) Playback: MediaSession stays hidden in custom mode, but foreground notification
          # keeps title/artwork/buttons. Artist is removed everywhere from MediaMetadata/notification.
          p = Path('app/src/main/java/com/intentplayer/service/PlaybackService.kt')
          s = p.read_text()
          start = s.index('    private fun buildSilentPlaybackNotification(): Notification {')
          end = s.index('    private fun loadArtworkBitmap', start)
          notification = r'''    private fun buildSilentPlaybackNotification(): Notification {
        val player = exoPlayer
        val metadata = player?.currentMediaItem?.mediaMetadata
        val title = metadata?.title?.toString().orEmpty().ifBlank { "Unknown" }
        val idx = player?.currentMediaItemIndex ?: 0
        val total = playlist.size
        val indexText = if (total > 0) "[${idx + 1}/$total]" else ""
        val isPlaying = player?.isPlaying == true
        val statusText = if (isPlaying) "再生中" else "一時停止中"
        val tapIntent = PendingIntent.getActivity(
            this,
            0,
            Intent(this, MainActivity::class.java).apply {
                flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_NEW_TASK
            },
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        fun buildActionIntent(command: String): PendingIntent = PendingIntent.getBroadcast(
            this,
            command.hashCode(),
            Intent(this, ControlReceiver::class.java).apply {
                action = ControlReceiver.ACTION_CONTROL
                putExtra(ControlReceiver.EXTRA_COMMAND, command)
            },
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        val builder = NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
            .setSmallIcon(R.drawable.ic_notification)
            .setContentTitle("$indexText $title".trim())
            .setContentText(statusText)
            .setContentIntent(tapIntent)
            .addAction(0, "前へ", buildActionIntent(ControlReceiver.CMD_PREVIOUS))
            .addAction(0, if (isPlaying) "一時停止" else "再生", buildActionIntent(if (isPlaying) ControlReceiver.CMD_PAUSE else ControlReceiver.CMD_PLAY))
            .addAction(0, "次へ", buildActionIntent(ControlReceiver.CMD_NEXT))
            .addAction(0, "停止", buildActionIntent(ControlReceiver.CMD_STOP))
            .setPriority(NotificationCompat.PRIORITY_LOW)
            .setOngoing(true)
            .setSilent(true)
        loadArtworkBitmap(metadata?.artworkUri)?.let(builder::setLargeIcon)
        return builder.build()
    }

'''
          s = s[:start] + notification + s[end:]
          s = s.replace('        .setArtist(track.artist ?: "Unknown Artist")\n', '')
          s = s.replace('private const val MAX_LOUDNESS_GAIN_MB = 600', 'private const val MAX_LOUDNESS_GAIN_MB = 1_400')
          p.write_text(s)
          PY

          rm -f .github/workflows/apply-settings-improvements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/intentplayer/storage/PreferencesManager.kt app/src/main/java/com/intentplayer/ui/SettingsScreen.kt app/src/main/java/com/intentplayer/ui/MainScreen.kt app/src/main/java/com/intentplayer/service/PlaybackService.kt .github/workflows/apply-settings-improvements.yml
          git commit -m "Improve settings UX and extend volume boost"
          git push origin HEAD:hide-external-media-session
